services:
  # PostgreSQL with pgvector extension — stores embeddings for the RAG knowledge base
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voiceagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend — starts only after postgres is healthy
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/code

  # Vite + React frontend — exposed on host port 5174
  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5173"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keeps container node_modules isolated from host

volumes:
  pgdata:  # named volume so postgres data persists across container restarts
